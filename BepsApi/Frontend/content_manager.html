<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 문서 관리 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }
        
        body {
            background-color: white;
            padding: 10px;
        }
        
        .container {
            max-width: 100%;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .filter-bar {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
        }
        
        .filter-label {
            font-weight: bold;
            margin-right: 15px;
        }
        
        .filter-options {
            display: flex;
            gap: 10px;
        }
        
        .filter-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .filter-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        
        .tabs-container {
            display: flex;
            height: calc(100vh - 200px);
            min-height: 500px;
            border: 1px solid #ddd;
        }
        
        .left-tab {
            width: 25%;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        
        .right-tab {
            width: 75%;
            overflow-y: auto;
        }
        
        .content-header, .file-header {
            background-color: #f2f2f2;
            padding: 12px 15px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }
        
        .content-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        
        .content-item:hover {
            background-color: #f5f5f5;
        }
        
        .file-list {
            width: 100%;
            border-collapse: collapse;
        }
        
        .file-list th {
            background-color: #f2f2f2;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }
        
        .file-list td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        
        .folder-item {
            display: flex;
            align-items: center;
        }
        
        .folder-icon {
            color: #ffc107;
            margin-right: 8px;
        }
        
        .file-icon {
            color: #ff9800;
            margin-right: 8px;
        }
        
        /* Tree view styles */
        .tree-view {
            list-style: none;
            padding-left: 0;
        }
        
        .tree-node {
            padding: 5px 0;
        }
        
        .tree-folder {
            cursor: pointer;
            padding: 5px 0;
            display: flex;
            align-items: center;
        }
        
        .tree-content {
            padding-left: 20px;
            display: none;
        }
        
        .tree-content.expanded {
            display: block;
        }
        
        .toggle-icon {
            display: inline-block;
            width: 15px;
            text-align: center;
            margin-right: 5px;
        }
        
        .tree-file {
            display: grid;
            grid-template-columns: minmax(200px, 2fr) 1fr 1fr 1fr 1fr 1fr;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }
        
        .file-details {
            display: none; /* Hide the previous file details container */
        }
        
        .file-detail {
            padding: 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-name {
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-name-content {
            display: flex;
            align-items: center;
        }
        
        .new-badge {
            display: inline-block;
            background-color: #3f51b5;
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .download-icon {
            margin-left: auto;
            cursor: pointer;
            color: #555;
        }
        
        .upload-icon {
            margin-left: auto;
            cursor: pointer;
            color: #4caf50;
        }
        
        .modify-icon {
            margin-left: 5px;
            cursor: pointer;
            color: #ff9800;
            font-size: 14px;
        }
        
        .modify-icon:hover {
            color: #f57c00;
        }
        
        .file-name-clickable {
            cursor: pointer;
            color: #1976d2;
            text-decoration: underline;
        }
        
        .file-name-normal {
            color: inherit;
        }
        
        /* Image modal styles */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .image-modal-content {
            position: relative;
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 800px;
            background-color: white;
            border-radius: 5px;
        }
        
        .image-modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }
        
        .image-modal-close:hover {
            color: #000;
        }
        
        .image-modal img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
        }
        
        .image-modal-title {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
            justify-content: flex-end;
        }
        
        .add-btn, .remove-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .add-btn {
            background-color: #4caf50;
            color: white;
        }
        
        .remove-btn {
            background-color: #f44336;
            color: white;
        }
        
        .bottom-actions {
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }
        
        .loading {
            padding: 20px;
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .selected {
            background-color: #e3f2fd;
        }

        .file-header {
            background-color: #f2f2f2;
            padding: 12px 15px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            display: grid;
            grid-template-columns: minmax(200px, 2fr) 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="filter-bar">
            <span class="filter-label">처리상태</span>
            <div class="filter-options">
                <label class="filter-option">
                    <input type="checkbox" checked id="filter-all"> 전체
                </label>
                <label class="filter-option">
                    <input type="checkbox" checked id="filter-reviewing"> 검토중
                </label>
                <label class="filter-option">
                    <input type="checkbox" checked id="filter-rejected"> 반려
                </label>
                <label class="filter-option">
                    <input type="checkbox" checked id="filter-approved"> 승인
                </label>
                <label class="filter-option">
                    <input type="checkbox" checked id="filter-updated"> 업데이트
                </label>
            </div>
        </div>
        
        <div class="tabs-container">
            <!-- 좌측 콘텐츠 탭 -->
            <div class="left-tab">
                <div class="content-header">콘텐츠</div>
                
                <!-- 콘텐츠 목록 - 동적으로 채워질 영역 -->
                <div id="content-list">
                    <div class="loading">콘텐츠를 불러오는 중입니다...</div>
                </div>
                
                <!-- 좌측 탭 하단 버튼 -->
                <div class="bottom-actions">
                    <div>
                        <button class="add-btn" id="add-content">+</button>
                        <button class="remove-btn" id="remove-content">-</button>
                    </div>
                </div>
            </div>
            
            <!-- 우측 파일 탭 -->
            <div class="right-tab">
                <div class="file-header">
                    <div>파일명</div>
                    <div>버전</div>
                    <div>작성자</div>
                    <div>검토자</div>
                    <div>등록일</div>
                    <div>처리상태</div>
                </div>
                <div id="file-tree-view" class="tree-view">
                    <div class="loading">채널을 선택하면 파일 구조가 표시됩니다.</div>
                </div>
                
                <!-- 우측 탭 하단 버튼 -->
                <div class="bottom-actions">
                    <div>
                        <button class="add-btn" id="add-file">+</button>
                        <button class="remove-btn" id="remove-file">-</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <div class="image-modal-content">
            <span class="image-modal-close">&times;</span>
            <div class="image-modal-title" id="imageModalTitle">이미지 보기</div>
            <img id="imageModalImg" src="" alt="파일 이미지">
        </div>
    </div>
    
    <script>
        // Authentication check and role-based access control
        document.addEventListener('DOMContentLoaded', function() {
            const userInfo = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
            const roleId = userInfo && userInfo.user ? userInfo.user.role_id : null;
            const userId = userInfo && userInfo.user ? userInfo.user.id : null;
            
            // Store user role ID for later access control checks
            window.userRoleId = roleId;
            window.userId = userId;
            
            // For completely restricted areas (development only)
            if (document.getElementById('filter-all') && roleId !== 999) {
                document.body.innerHTML = `
                    <div style="text-align: center; margin-top: 50px; color: #f44336;">
                        <h1>접근 권한이 없습니다</h1>
                        <p style="font-size: 1.5rem;">이 페이지는 개발자 권한이 필요합니다.</p>
                        <p>현재 당신의 권한은 ${roleId || "없음"}입니다.</p>
                    </div>
                `;
                return;
            }
            
            // Continue with normal page initialization
            initializeContentManager();
            setupFilterHandlers();
            setupTreeViewEventHandlers();
        });
        
        // 상태 관리
        let currentSelectedChannel = null;
        let hierarchyData = null;
        let userAccessibleFolders = []; // For restricted users
        let userAccessibleFiles = []; // For restricted users
        
        // DOM 요소
        const contentListElement = document.getElementById('content-list');
        const fileTreeViewElement = document.getElementById('file-tree-view');
        
        // 필터 핸들러 설정
        function setupFilterHandlers() {
            const filterCheckboxes = document.querySelectorAll('.filter-options input[type="checkbox"]');
            filterCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (currentSelectedChannel) {
                        renderFolderFileStructure(currentSelectedChannel);
                    }
                });
            });
        }

        // 트리 뷰 이벤트 핸들러 설정
        function setupTreeViewEventHandlers() {
            // 이벤트 위임을 통해 폴더 토글 기능 구현
            document.getElementById('file-tree-view').addEventListener('click', function(e) {
                const target = e.target.closest('.tree-folder');
                if (target) {
                    const content = target.nextElementSibling;
                    if (content && content.classList.contains('tree-content')) {
                        content.classList.toggle('expanded');
                        
                        // 토글 아이콘 변경
                        const toggleIcon = target.querySelector('.toggle-icon');
                        if (toggleIcon) {
                            toggleIcon.textContent = content.classList.contains('expanded') ? '▼' : '►';
                        }
                    }
                }
            });
        }
        
        // 콘텐츠 매니저 초기화
        async function initializeContentManager() {
            try {
                contentListElement.innerHTML = '<div class="loading">콘텐츠 구조를 불러오는 중입니다...</div>';
                
                // 전체 계층 구조 가져오기 (API 사용)
                hierarchyData = await getContentHierarchy();
                
                if (!hierarchyData) {
                    throw new Error('계층 구조를 가져오는데 실패했습니다.');
                }
                
                // 일반 사용자인 경우 접근 가능한 항목 필터링
                if (window.userRoleId !== 1 && window.userRoleId !== 2 && window.userRoleId !== 999) {
                    await getUserAccessibleContent();
                    filterHierarchyForUser();
                }
                
                // 채널 목록 렌더링
                renderChannels();
                
            } catch (error) {
                console.error('콘텐츠 구조를 가져오는 중 오류가 발생했습니다:', error);
                contentListElement.innerHTML = '<div class="loading">콘텐츠 구조를 불러오는데 실패했습니다. 다시 시도해 주세요.</div>';
            }
        }
        
        // API를 통해 계층 구조 가져오기
        async function getContentHierarchy() {
            try {
                // API 엔드포인트 호출
                const response = await fetch('/contents/hierarchy');
                if (!response.ok) {
                    throw new Error(`계층 구조를 가져오는데 실패했습니다: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('계층 구조를 불러오는 중 오류가 발생했습니다:', error);
                return null;
            }
        }
        
        // 사용자가 접근할 수 있는 콘텐츠 가져오기 (일반 사용자용)
        async function getUserAccessibleContent() {
            try {
                // API 엔드포인트 호출
                const response = await fetch(`/contents/user-accessible?user_id=${window.userId}`);
                if (!response.ok) {
                    throw new Error(`접근 가능한 콘텐츠를 가져오는데 실패했습니다: ${response.status}`);
                }
                
                const data = await response.json();
                userAccessibleFolders = data.folderIds || [];
                userAccessibleFiles = data.fileIds || [];
                
            } catch (error) {
                console.error('사용자 접근 가능 콘텐츠를 가져오는 중 오류가 발생했습니다:', error);
                userAccessibleFolders = [];
                userAccessibleFiles = [];
            }
        }
        
        // 사용자 권한에 따라 계층 구조 필터링
        function filterHierarchyForUser() {
            if (!hierarchyData || !hierarchyData.channels) {
                return;
            }
            
            // 접근 가능한 채널만 필터링
            hierarchyData.channels = hierarchyData.channels.filter(channel => {
                // 채널 내 폴더 필터링
                channel.folders = filterFoldersForUser(channel.folders || []);
                
                // 접근 가능한 폴더가 있는 채널만 표시
                return channel.folders.length > 0;
            });
        }
        
        // 폴더 필터링 (재귀 함수)
        function filterFoldersForUser(folders) {
            return folders.filter(folder => {
                // 이 폴더가 접근 가능한지 확인
                const isAccessible = userAccessibleFolders.includes(folder.id);
                
                // 하위 폴더 필터링
                if (folder.subfolders && folder.subfolders.length > 0) {
                    folder.subfolders = filterFoldersForUser(folder.subfolders);
                }
                
                // 파일 필터링
                if (folder.pages && folder.pages.length > 0) {
                    folder.pages = folder.pages.filter(page => 
                        userAccessibleFiles.includes(page.id)
                    );
                }
                
                // 이 폴더가 접근 가능하거나 접근 가능한 하위 항목이 있으면 포함
                return isAccessible || 
                       (folder.subfolders && folder.subfolders.length > 0) || 
                       (folder.pages && folder.pages.length > 0);
            });
        }
        
        // 채널 목록 렌더링
        function renderChannels() {
            contentListElement.innerHTML = '';
            
            if (!hierarchyData || !hierarchyData.channels || hierarchyData.channels.length === 0) {
                contentListElement.innerHTML = '<div class="loading">표시할 채널이 없습니다.</div>';
                return;
            }
            
            hierarchyData.channels.forEach(channel => {
                const contentItem = document.createElement('div');
                contentItem.className = 'content-item';
                contentItem.dataset.id = channel.id;
                
                const folderItem = document.createElement('div');
                folderItem.className = 'folder-item';
                
                const folderIcon = document.createElement('span');
                folderIcon.className = 'folder-icon';
                folderIcon.innerHTML = '&#128193;';
                
                folderItem.appendChild(folderIcon);
                folderItem.appendChild(document.createTextNode(channel.name));
                
                if (channel.is_new) {
                    const newBadge = document.createElement('span');
                    newBadge.className = 'new-badge';
                    newBadge.textContent = 'NEW';
                    folderItem.appendChild(newBadge);
                }
                
                contentItem.appendChild(folderItem);
                contentListElement.appendChild(contentItem);
                
                // 클릭 이벤트 처리
                contentItem.addEventListener('click', function() {
                    selectChannel(channel.id);
                });
            });
        }
        
        // 채널 선택 처리
        function selectChannel(channelId) {
            // 이미 선택된 항목의 스타일 제거
            const contentItems = document.querySelectorAll('.content-item');
            contentItems.forEach(item => item.classList.remove('selected'));
            
            // 현재 선택된 항목 스타일 지정
            const selectedItem = document.querySelector(`.content-item[data-id="${channelId}"]`);
            if (selectedItem) {
                selectedItem.classList.add('selected');
            }
            
            currentSelectedChannel = channelId;
            renderFolderFileStructure(channelId);
        }
        
        // 폴더 및 파일 구조 렌더링
        function renderFolderFileStructure(channelId) {
            fileTreeViewElement.innerHTML = '';
            
            if (!hierarchyData || !hierarchyData.channels) {
                fileTreeViewElement.innerHTML = '<div class="loading">폴더 및 파일 구조를 불러오는데 실패했습니다.</div>';
                return;
            }
            
            // 선택된 채널 찾기
            const selectedChannel = hierarchyData.channels.find(channel => channel.id === channelId);
            
            if (!selectedChannel || !selectedChannel.folders || selectedChannel.folders.length === 0) {
                fileTreeViewElement.innerHTML = '<div class="loading">표시할 폴더 및 파일이 없습니다.</div>';
                return;
            }
            
            // 필터 상태 가져오기
            const filters = {
                all: document.getElementById('filter-all').checked,
                reviewing: document.getElementById('filter-reviewing').checked,
                rejected: document.getElementById('filter-rejected').checked,
                approved: document.getElementById('filter-approved').checked,
                updated: document.getElementById('filter-updated').checked
            };
            
            // 채널 계층 구조 가져오기 (필터 포함)
            fetchChannelHierarchy(channelId, filters);
        }
        
        // 채널의 계층 구조 가져오기 (API 사용)
        async function fetchChannelHierarchy(channelId, filters) {
            try {
                fileTreeViewElement.innerHTML = '<div class="loading">폴더 및 파일 구조를 불러오는 중입니다...</div>';
                
                // 필터 JSON 직렬화
                const filtersParam = encodeURIComponent(JSON.stringify(filters));
                
                // API 엔드포인트 호출
                const response = await fetch(`/contents/hierarchy/channel/${channelId}?filters=${filtersParam}`);
                if (!response.ok) {
                    throw new Error(`채널 계층 구조를 가져오는데 실패했습니다: ${response.status}`);
                }
                
                const data = await response.json();
                
                // 계층 구조 표시
                renderHierarchyTree(data);
            } catch (error) {
                console.error('채널 계층 구조를 가져오는 중 오류가 발생했습니다:', error);
                fileTreeViewElement.innerHTML = '<div class="loading">폴더 및 파일 구조를 불러오는데 실패했습니다. 다시 시도해 주세요.</div>';
            }
        }

        // 폴더가 현재 필터에 맞는지 확인하는 함수
        function folderMatchesFilter(folder) {
            // 모든 항목 필터가 활성화되어 있으면 모든 폴더 포함
            if (document.getElementById('filter-all').checked) {
                return true;
            }
            
            // 하위 폴더나 파일이 현재 필터에 맞는 항목을 포함하고 있는지 확인
            if (folder.subfolders && folder.subfolders.length > 0) {
                return folder.subfolders.some(subfolder => folderMatchesFilter(subfolder));
            }
            
            // 이 폴더의 파일 중 필터에 맞는 것이 있는지 확인
            if (folder.pages && folder.pages.length > 0) {
                const filterReviewing = document.getElementById('filter-reviewing').checked;
                const filterRejected = document.getElementById('filter-rejected').checked;
                const filterApproved = document.getElementById('filter-approved').checked;
                const filterUpdated = document.getElementById('filter-updated').checked;
                
                return folder.pages.some(page => 
                    (filterReviewing && page.status === '검토중') ||
                    (filterRejected && page.status === '반려') ||
                    (filterApproved && page.status === '승인') ||
                    (filterUpdated && page.status === '업데이트')
                );
            }
            
            return false;
        }

        // 계층 구조 트리 렌더링
        function renderHierarchyTree(data) {
            fileTreeViewElement.innerHTML = '';
            
            const folders = data.folders || [];
            
            if (folders.length === 0) {
                fileTreeViewElement.innerHTML = '<div class="loading">표시할 폴더 및 파일이 없습니다.</div>';
                return;
            }
            
            // 폴더를 이름 기준 오름차순으로 정렬
            folders.sort((a, b) => a.name.localeCompare(b.name));
            
            // 트리 구조 생성
            const treeRoot = document.createElement('ul');
            treeRoot.className = 'tree-view';
            
            // 폴더 렌더링
            folders.forEach(folder => {
                const folderNode = createFolderNode(folder, 0);
                treeRoot.appendChild(folderNode);
            });
            
            fileTreeViewElement.appendChild(treeRoot);
        }
        
        // 폴더 노드 생성 (재귀 함수)
        function createFolderNode(folder, depth = 0) {
            const folderLi = document.createElement('li');
            folderLi.className = 'tree-node';
            folderLi.dataset.id = folder.id;
            
            // 폴더 이름 및 아이콘
            const folderDiv = document.createElement('div');
            folderDiv.className = 'tree-folder';
            
            const toggleIcon = document.createElement('span');
            toggleIcon.className = 'toggle-icon';
            toggleIcon.textContent = '►';
            
            const folderIcon = document.createElement('span');
            folderIcon.className = 'folder-icon';
            folderIcon.innerHTML = '&#128193;';
            
            folderDiv.appendChild(toggleIcon);
            folderDiv.appendChild(folderIcon);
            folderDiv.appendChild(document.createTextNode(folder.name));
            
            if (folder.is_new) {
                const newBadge = document.createElement('span');
                newBadge.className = 'new-badge';
                newBadge.textContent = 'NEW';
                folderDiv.appendChild(newBadge);
            }
            
            folderLi.appendChild(folderDiv);
            
            // 서브 폴더 및 파일을 포함하는 컨테이너
            const contentUl = document.createElement('ul');
            contentUl.className = 'tree-content';
            
            // 서브 폴더 렌더링 (필터 적용)
            if (folder.subfolders && folder.subfolders.length > 0) {
                const filteredSubfolders = folder.subfolders.filter(subfolder => 
                    folderMatchesFilter(subfolder)
                );
                
                // 서브폴더를 이름 기준 오름차순으로 정렬
                filteredSubfolders.sort((a, b) => a.name.localeCompare(b.name));
                
                filteredSubfolders.forEach(subfolder => {
                    const subfolderNode = createFolderNode(subfolder, depth + 1);
                    contentUl.appendChild(subfolderNode);
                });
            }
            
            // 파일 렌더링 (필터 적용)
            if (folder.pages && folder.pages.length > 0) {
                const filters = {
                    all: document.getElementById('filter-all').checked,
                    reviewing: document.getElementById('filter-reviewing').checked,
                    rejected: document.getElementById('filter-rejected').checked,
                    approved: document.getElementById('filter-approved').checked,
                    updated: document.getElementById('filter-updated').checked
                };
                
                const filteredFiles = folder.pages.filter(page => {
                    // 모든 파일 포함 또는 특정 상태 파일 포함
                    return filters.all || 
                           (filters.reviewing && page.status === '검토중') ||
                           (filters.rejected && page.status === '반려') ||
                           (filters.approved && page.status === '승인') ||
                           (filters.updated && page.status === '업데이트');
                });
                
                // 파일을 이름 기준 오름차순으로 정렬
                filteredFiles.sort((a, b) => (a.name || '제목 없음').localeCompare(b.name || '제목 없음'));
                
                filteredFiles.forEach(page => {
                    const fileLi = document.createElement('li');
                    fileLi.className = 'tree-node';
                    fileLi.dataset.id = page.id;
                    
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'tree-file';
                    
                    // 파일 이름 및 아이콘 (첫 번째 열)
                    const fileNameDiv = document.createElement('div');
                    fileNameDiv.className = 'file-name';
                    
                    // 내부 컨테이너 생성하여 패딩 적용 (깊이에 따른 들여쓰기)
                    const fileNameContent = document.createElement('div');
                    fileNameContent.className = 'file-name-content';
                    // 깊이별 들여쓰기 계산 (각 깊이 레벨당 20px)
                    fileNameContent.style.paddingLeft = `${(depth + 1) * 20}px`;
                    
                    const fileIcon = document.createElement('span');
                    fileIcon.className = 'file-icon';
                    fileIcon.innerHTML = '&#128196;';
                    
                    fileNameContent.appendChild(fileIcon);
                    
                    // Check if file has an image (object_id is not null/empty)
                    const hasImage = page.object_id && page.object_id.trim() !== '';
                    
                    // Create filename text element
                    const fileNameText = document.createElement('span');
                    fileNameText.textContent = page.name || '제목 없음';
                    
                    if (hasImage) {
                        // State 2: File has image - make filename clickable
                        fileNameText.className = 'file-name-clickable';
                        fileNameText.addEventListener('click', (e) => {
                            e.stopPropagation();
                            showImageModal(page.id, page.name);
                        });
                    } else {
                        // State 1: File has no image - normal text
                        fileNameText.className = 'file-name-normal';
                    }
                    
                    fileNameContent.appendChild(fileNameText);
                    
                    if (page.is_new) {
                        const newBadge = document.createElement('span');
                        newBadge.className = 'new-badge';
                        newBadge.textContent = 'NEW';
                        fileNameContent.appendChild(newBadge);
                    }
                    
                    fileNameDiv.appendChild(fileNameContent);
                    
                    // Add appropriate icon based on state
                    if (hasImage) {
                        // State 2: Show modify button for files with images
                        const modifyIcon = document.createElement('span');
                        modifyIcon.className = 'modify-icon';
                        modifyIcon.innerHTML = '&#9998;'; // Edit/pencil icon
                        modifyIcon.title = '이미지 수정';
                        modifyIcon.addEventListener('click', (e) => {
                            e.stopPropagation();
                            modifyImage(page.id);
                        });
                        
                        fileNameDiv.appendChild(modifyIcon);
                    } else {
                        // State 1: Show upload icon
                        const uploadIcon = document.createElement('span');
                        uploadIcon.className = 'upload-icon';
                        uploadIcon.innerHTML = '&#8593;'; // Upload arrow
                        uploadIcon.title = '이미지 업로드';
                        uploadIcon.addEventListener('click', (e) => {
                            e.stopPropagation();
                            uploadImage(page.id);
                        });
                        
                        fileNameDiv.appendChild(uploadIcon);
                    }
                    
                    fileDiv.appendChild(fileNameDiv);
                    
                    // 버전 열
                    const versionDiv = document.createElement('div');
                    versionDiv.className = 'file-detail';
                    versionDiv.textContent = page.version || '1.0';
                    fileDiv.appendChild(versionDiv);
                    
                    // 작성자 열
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'file-detail';
                    authorDiv.textContent = page.author || '-';
                    fileDiv.appendChild(authorDiv);
                    
                    // 검토자 열
                    const reviewerDiv = document.createElement('div');
                    reviewerDiv.className = 'file-detail';
                    reviewerDiv.textContent = page.reviewer || '-';
                    fileDiv.appendChild(reviewerDiv);
                    
                    // 등록일 열
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'file-detail';
                    dateDiv.textContent = page.registration_date || '-';
                    fileDiv.appendChild(dateDiv);
                    
                    // 처리상태 열
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'file-detail';
                    statusDiv.textContent = page.status || '검토중';
                    fileDiv.appendChild(statusDiv);
                    
                    fileLi.appendChild(fileDiv);
                    contentUl.appendChild(fileLi);
                });
            }
            
            folderLi.appendChild(contentUl);
            
            return folderLi;
        }

        // 이미지 업로드
        function uploadImage(fileId) {
            console.log(`이미지 업로드: ${fileId}`);
            
            // 권한 검사
            if (window.userRoleId !== 999 && window.userRoleId !== 1 && window.userRoleId !== 2) {
                alert('이미지 업로드 권한이 없습니다.');
                return;
            }
            
            // 파일 선택 다이얼로그 생성
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.multiple = false;
            
            fileInput.onchange = function() {
                if (!fileInput.files || fileInput.files.length === 0) {
                    return;
                }
                
                const imageFile = fileInput.files[0];
                
                // 파일 크기 검사 (10MB 제한)
                if (imageFile.size > 10 * 1024 * 1024) {
                    alert('파일 크기가 너무 큽니다. 10MB 이하의 파일을 선택해주세요.');
                    return;
                }
                
                // FormData 생성
                const formData = new FormData();
                formData.append('image', imageFile);
                
                // 업로드 API 호출
                fetch(`/contents/file/${fileId}/upload-image`, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`이미지 업로드에 실패했습니다: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    alert('이미지가 성공적으로 업로드되었습니다.');
                    
                    // 파일 목록 새로고침
                    if (currentSelectedChannel) {
                        const filters = {
                            all: document.getElementById('filter-all').checked,
                            reviewing: document.getElementById('filter-reviewing').checked,
                            rejected: document.getElementById('filter-rejected').checked,
                            approved: document.getElementById('filter-approved').checked,
                            updated: document.getElementById('filter-updated').checked
                        };
                        fetchChannelHierarchy(currentSelectedChannel, filters);
                    }
                })
                .catch(error => {
                    console.error('이미지 업로드 중 오류가 발생했습니다:', error);
                    alert('이미지 업로드 중 오류가 발생했습니다.');
                });
            };
            
            fileInput.click();
        }

        // 파일 선택 기능 추가
        document.addEventListener('click', function(e) {
            const fileNode = e.target.closest('.tree-file');
            if (fileNode) {
                // 이미 선택된 파일 선택 해제
                document.querySelectorAll('.tree-file.selected').forEach(node => {
                    node.classList.remove('selected');
                });
                
                // 현재 파일 선택
                fileNode.classList.add('selected');
            }
        });
    </script>
</body>
</html>
