<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>통계 미리보기</title>
  <script src="asset/js/config.js"></script>
  <style>
    body 
    { 
        font-family: Arial, 
        sans-serif; 
        padding: 20px;
        padding-bottom: 80px; 
    }
    table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
    th, td { border: 1px solid #ccc; padding: 3px 4px; text-align: center; }
    th { background-color: #f5f5f5; }
    td { font-size: 12px;}

    .tab-btn {
        padding: 8px 16px;
        background-color: #f2f2f2;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
      }
    
      .tab-btn.active {
        background-color: #d0e1ff;
        font-weight: bold;
      }
    
      .sheet {
        margin-top: 20px;
      }

      #sheet-tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: white;
        border-top: 1px solid #ddd;
        padding: 10px 20px;
        display: flex;
        gap: 10px;
        justify-content: flex-start;
      }

  </style>
</head>
<body>
    <div style="text-align: right; margin-bottom: 10px;">
        <button onclick="downloadExcel()" id="download-button" class="tab-btn" disabled>엑셀 다운로드</button>
    </div>
    <a id="download-link" style="display: none;"></a>

    <h2 id="date-range">통계 미리보기</h2>

    <div id="loading-message" style="display:none;">📊 로딩 중입니다... 잠시만 기다려주세요.</div>

    <!-- 탭 콘텐츠 -->
    <div id="sheet-content" class="sheet active">
      <h3>전체 컨텐츠</h3>
      <div id="content-html"></div>
    </div>
  
    <div id="sheet-user" class="sheet" style="display:none;">
      <h3>회사 & 팀 & 직원</h3>
      <div id="user-html"></div>
    </div>
  
    <!-- 하단 시트 버튼 -->
    <div id="sheet-tabs" style="margin-top: 30px; border-top: 1px solid #ddd; padding-top: 10px; display: flex; gap: 10px;">
      <button onclick="showSheet('content')" class="tab-btn active">전체컨텐츠</button>
      <button onclick="showSheet('user')" class="tab-btn">회사&팀&직원</button>
    </div>

  <script>
    let download_button;
    let loading_message;
    document.addEventListener("DOMContentLoaded", function() {
        download_button = document.getElementById("download-button");
        loading_message = document.getElementById("loading-message");
        download_button.disabled = true;
        loading_message.style.display = "block";

        window.addEventListener("resize", updateIframeHeights);
        updateIframeHeights();
    });

    const params = new URLSearchParams(window.location.search);
    const apiUrl = `${window.baseUrl}statistics/preview?${params.toString()}`;
    let filepath = null;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        filepath = data.filename;

        //document.getElementById('content-html').innerHTML = 
        //  `<iframe src="${window.baseUrl}${data.content_html_name}" width="100%" style="border:none;"></iframe>`//data.content_html;
        //document.getElementById('user-html').innerHTML = 
        //  `<iframe src="${window.baseUrl}${data.user_html_name}" width="100%" style="border:none;"></iframe>`//data.user_html;

        insertIframe('content-html', data.content_html_name);
        insertIframe('user-html', data.user_html_name);
      })
      .catch(() => {
        document.body.innerHTML = '<p>통계 데이터를 불러오지 못했습니다.</p>';
      }).finally(() => {
        loading_message.style.display = "none";
        download_button.disabled = false;
      });

    function showSheet(type) {
    // 콘텐츠 토글
    document.getElementById('sheet-content').style.display = type === 'content' ? 'block' : 'none';
    document.getElementById('sheet-user').style.display = type === 'user' ? 'block' : 'none';
    
    // 버튼 상태 갱신
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick*="${type}"]`).classList.add('active');
    }

    function downloadExcel() {
        if(!filepath) {
            alert('엑셀 파일이 준비되지 않았습니다.');
            return;
        }
        
        const encoded = encodeURIComponent(filepath);   // filepath는 서버에서 제공 -> encodeURIComponent로 인코딩
        const link = document.getElementById('download-link');   // 다운로드 링크 생성
        link.href = `${window.baseUrl}statistics/download?file_path=${encoded}`;
        link.download ='';
        link.click();   // 다운로드 링크를 클릭하여 파일 다운로드
    }

    function updateIframeHeights() {
      const topOffset = document.getElementById('sheet-tabs').offsetHeight + 160;
      const height = window.innerHeight - topOffset- 80;
    
      document.querySelectorAll('#content-html iframe, #user-html iframe').forEach(iframe => {
        iframe.style.height = `${height}px`;
      });
    }

    function insertIframe(targetId, src) {
      const topOffset = document.getElementById('sheet-tabs').offsetHeight + 160;
      const height = window.innerHeight - topOffset - 80;
    
      const container = document.getElementById(targetId);
      const iframe = document.createElement('iframe');
      iframe.src = `${window.baseUrl}${src}`;
      iframe.width = '100%';
      iframe.style.border = 'none';
      iframe.style.height = `${height}px`;
    
      // 로드 완료 후에도 높이 다시 적용 (resize 대응 포함)
      iframe.onload = () => updateIframeHeights();
    
      container.innerHTML = '';
      container.appendChild(iframe);
    }

  </script>
</body>
</html>
