<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>학습 현황</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="asset/css/flatpickr.min.css">
        <link rel="stylesheet" href="asset/css/custom_vscroll.css">
        <link rel="stylesheet" href="asset/css/progress_admin_search.css">
        <link rel="stylesheet" href="asset/css/progress_admin_active_user.css">
        <link rel="stylesheet" href="asset/css/progress_admin.css">
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>       
        <script type="text/javascript" src="asset/js/echarts.min.js"></script>
        <script src="asset/js/flatpickr.min.js"></script>
        <script src="asset/js/ko.js"></script>
        <script src="asset/js/config.js"></script>
        <script type="module" src="asset/js/progress_admin.js"></script>
    </head>

    <body>

        <div class="left-area">

            <div class="filter">
                <input type="search" class="search" id="filter-search" placeholder="회사, 팀, 사람이름" />
                <img src="asset/images/search.png" id="filter-search-icon" class="search-icon">
            </div>

            <div class="search-container-wrapper">
                <div class="search-container" id="container"></div>
            </div>

            <div class="active-user">
                <div class="listbox-container">
                    <div class="custom-listbox" id="activeUserList"></div>              
                </div>
                <div class="legend">
                    <span class="status-red"></span>진도율 낮은 학습자
                </div>
            </div>

            <div class="search-ip">               
                <div class="filter">
                    <input type="search" class="search" id="ipInput" placeholder="IP" />
                    <img src="asset/images/search.png" id="ipInput-icon" class="search-icon">
                </div>
                <div id="map"></div>      
            </div>

            <div class="traffic">
                <div class="gaugeChart" id="gaugeChart"></div>
                <span id="active-user-count">현재접속인원 : 0 명</span>
            </div>

        </div>

        <div class="main-area">
            <div class="header-area">
                <span class="selected-period" id="selected-period">전체 (2025년) </span>

                <div class="period-area">

                    <div class="dropdown">
                        <button tabindex="0" class="dropdown-button" id="year">
                            <span id="year-label">년도</span>                 
                            <svg class="icon" width="13" height="13" viewBox="0 0 26 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M0 8.73087L3.06475 5.66504L13.0043 15.7823L22.9353 5.66504L26 8.73087L13.0043 21.915L0 8.73087Z" fill="#3A3541"/>
                            </svg>
                        </button>
                        <div tabindex="0" class="dropdown-list" id="year-list">
                        </div>
                    </div>
    
                    <button tabindex="0" class="year-button" id="year-button" > 연간 </button>
    
                    <div class="dropdown">
                        <button tabindex="0" class="dropdown-button" id="half-year">
                            <span id="half-year-label">반기</span>
                            <svg class="icon" width="13" height="13" viewBox="0 0 26 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M0 8.73087L3.06475 5.66504L13.0043 15.7823L22.9353 5.66504L26 8.73087L13.0043 21.915L0 8.73087Z" fill="#3A3541"/>
                            </svg>
                        </button>
                        <div tabindex="0" class="dropdown-list" id="half-year-list">
                        <div><button class="dropdown-item">상반기</button></div>
                        <div><button class="dropdown-item">하반기</button></div>
                        </div>
                    </div>
    
                    <div class="dropdown">
                        <button tabindex="0" class="dropdown-button" id="quarter">
                            <span id="quarter-label">분기</span> 
                            <svg class="icon" width="13" height="13" viewBox="0 0 26 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M0 8.73087L3.06475 5.66504L13.0043 15.7823L22.9353 5.66504L26 8.73087L13.0043 21.915L0 8.73087Z" fill="#3A3541"/>
                            </svg>
                        </button>
                        <div tabindex="0" class="dropdown-list" id="quarter-list">
                            <div><button class="dropdown-item">1분기</button></div>
                            <div><button class="dropdown-item">2분기</button></div>
                            <div><button class="dropdown-item">3분기</button></div>
                            <div><button class="dropdown-item">4분기</button></div>
                        </div>
                    </div>
    
                    <div class="datepicker">
                        <input type="text" class="start-date" id="start-date">
                        <span>~</span>
                        <input type="text" class="end-date" id="end-date">
                    </div>
    
                    <button class="apply-button" id="apply-button">적용</button>
    
                </div>
            </div>
            

            <div class="chart-area">

                <div class="login-time">
                    <span class="total-login-time" id="total-login-time">접속 시간</span>
                    <span class="worktime-duration" id="worktime-duration">근무 시간 내</span>
                    <span class="offhour-duration" id="offhour-duration">근무 시간 외</span> 
                    <span></span> 
                    <span class="total-login-count" id="total-login-count">총 접속 횟수</span>
                    <span class="internal-count" id="internal-count">내부 접속 횟수</span>
                    <span class="external-count" id="external-count">외부 접속 횟수</span> 
                </div>
                            
                <div class="learing-time-Rank">
                    <div>
                        <span class="user-rank-first" id="user-rank-top-first">개인 상위 1위</span>
                        <span class="user-rank-second" id="user-rank-top-second">개인 상위 2위</span>
                        <span class="user-rank-third" id="user-rank-top-third">개인 상위 3위</span>
                    </div>
                    <div>
                        <span class="user-rank-first" id="user-rank-bottom-first">개인 하위 1위</span>
                        <span class="user-rank-second" id="user-rank-bottom-second">개인 하위 2위</span>
                        <span class="user-rank-third" id="user-rank-bottom-third">개인 하위 3위</span>
                    </div>
                    <span></span>
                    <div>
                        <span class="department-rank-first" id="team-rank-top-first">팀 1위</span>
                        <span class="department-rank-second" id="team-rank-top-second">팀 2위</span>
                        <span class="department-rank-third" id="team-rank-top-third">팀 3위</span>
                    </div>
                    <div>
                        <span class="department-rank-first" id="team-rank-bottom-first">팀 1위</span>
                        <span class="department-rank-second" id="team-rank-bottom-second">팀 2위</span>
                        <span class="department-rank-third" id="team-rank-bottom-third">팀 3위</span>
                    </div>
                    <span></span>
                    <div>                       
                        <span class="company-rank-first" id="company-rank-top-first">회사 1위</span>
                        <span class="company-rank-second" id="company-rank-top-second">회사 2위</span>
                        <span class="company-rank-third" id="company-rank-top-third"></span>
                    </div>
                    <div>                       
                        <span class="company-rank-first" id="company-rank-bottom-first">회사 1위</span>
                        <span class="company-rank-second" id="company-rank-bottom-second">회사 2위</span>
                        <span class="company-rank-third" id="company-rank-bottom-third"></span>
                    </div>
                </div>               
            </div>

            <div class="point">
                <span class="total-point" id="total-point">총 포인트</span>
                <span class="top-point" id="top-point">최상위 포인트</span>
                <span class="bottom-point" id="bottom-point">최하위 포인트</span>
            </div>

            <div class="learning-area">
                <div class="category-area" id="category_area"></div>
                <div class="top_viewed_pages" id="top_viewed_pages"></div>
                <div class="top_viewed_memos" id="memo_rank"></div>
            </div>

        </div>

        

    </body>

</html>
